# Rules for every workflow: SHA pins, least privilege, no CI-only checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # One gate, defined in verify.toml. Do not add check steps here:
      # a check that runs only in CI is one contributors cannot run
      # locally, which is how CI becomes the first line of defense
      # instead of the confirmation.
      - name: Verify
        run: python cantrips/verify.py
